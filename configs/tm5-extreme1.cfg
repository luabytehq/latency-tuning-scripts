# TestMem5 Extreme1 Configuration Preset
# Designed for DDR5 Memory Controller & Sub-Timing Stability Testing
# Referenced in: https://luabyte.com/blog/hardware/ddr5-sub-timings-tuning-guide

[TestMem5 Config]
TestVersion=12
Cycles=3
Language=0
TestName=Extreme1 by antares09 (LuaByte Presets)

# Timing Group Error Guide:
# Error 0, 1, 6: Insufficient DRAM VDD voltage or over-tightened tCL / tRFC.
# Error 2, 5   : Unstable turnaround timings (tFAW, tRRDL, tWR).
# Error 4, 8   : Memory controller instability (CPU VDDQ / SoC voltage).
# Error >20min : Thermal failure (tREFI exceeded DRAM cell refresh retention past 50°C).

[Test0]
Enable=1
Pattern=0x55555555
Time=100

[Test1]
Enable=1
Pattern=0xAAAAAAAA
Time=100

[Test2]
Enable=1
Pattern=0x33333333
Time=100

[Test3]
Enable=1
Pattern=0xCCCCCCCC
Time=100

[Test4]
Enable=1
Pattern=0x0F0F0F0F
Time=100

[Test5]
Enable=1
Pattern=0xF0F0F0F0
Time=100

[Test6]
Enable=1
Pattern=0x00FF00FF
Time=120

[Test7]
Enable=1
Pattern=0xFF00FF00
Time=120
