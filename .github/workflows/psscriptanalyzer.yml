name: PowerShell Script Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PSScriptAnalyzer Code Linter
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error,Warning
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer detected $($results.Count) issues."
          } else {
              Write-Host "All scripts passed PSScriptAnalyzer cleanly!" -ForegroundColor Green
          }
